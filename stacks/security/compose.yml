networks:
  proxy:
    external: true
  monitoring:
    external: true
  authelia:
    driver: bridge
  # not internal: the worker sends mail through smtp.gmail.com over it
  authentik:
    driver: bridge

services:
  authelia:
    build: ./authelia
    container_name: authelia
    restart: unless-stopped
    networks:
      - proxy
      - authelia
    volumes:
      - ../../configs/authelia/configuration.yml:/config/configuration.yml:ro
      - ${APPDATA}/security/authelia:/data
    environment:
      TZ: ${TZ}
      # the image runs as root unless these are set
      PUID: ${PUID}
      PGID: ${PGID}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    labels:
      traefik.enable: "true"
      traefik.http.routers.authelia.rule: "Host(`auth.${DOMAIN}`)"
      traefik.http.routers.authelia.entrypoints: "websecure"
      traefik.http.routers.authelia.tls.certresolver: "cloudflare"
      traefik.http.routers.authelia.middlewares: "secure-headers@file"
      traefik.http.services.authelia.loadbalancer.server.port: "9091"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt:
      - no-new-privileges:true

  crowdsec:
    build: ./crowdsec
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    volumes:
      - ${APPDATA}/security/crowdsec/config:/etc/crowdsec
      - ${APPDATA}/security/crowdsec/db:/var/lib/crowdsec/data
      - ${APPDATA}/security/crowdsec/hub:/etc/crowdsec/hub
      - /var/log:/var/log:ro
    environment:
      TZ: ${TZ}
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik crowdsecurity/nextcloud"
      GID: "${PGID}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt:
      - no-new-privileges:true

  crowdsec-bouncer:
    build: ./crowdsec-bouncer
    container_name: crowdsec-bouncer
    restart: unless-stopped
    networks:
      - proxy
    environment:
      TZ: ${TZ}
      CROWDSEC_BOUNCER_API_KEY: "${CROWDSEC_BOUNCER_API_KEY:-changeme_crowdsec_bouncer_key}"
      CROWDSEC_AGENT_HOST: "crowdsec:8080"
      GIN_MODE: "release"
    depends_on:
      - crowdsec
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          memory: 128m
    security_opt:
      - no-new-privileges:true

  # Authentik replaces Authelia in phases; no router uses it yet (configs/authentik/README.md)
  authentik-postgresql:
    build: ./authentik-postgresql
    container_name: authentik-postgresql
    restart: unless-stopped
    networks:
      - authentik
    environment:
      TZ: ${TZ}
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
    volumes:
      - ${APPDATA}/security/authentik/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    security_opt:
      - no-new-privileges:true

  # the image's own HEALTHCHECK (ak healthcheck) applies; it runs as uid 1000, so data/ must be owned by 1000
  authentik-server:
    build: ./authentik
    container_name: authentik-server
    command: server
    restart: unless-stopped
    shm_size: 512mb
    networks:
      - proxy
      - authentik
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    volumes:
      - ${APPDATA}/security/authentik/data:/data
      - ../../configs/authentik/blueprints:/blueprints/custom:ro
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_EMAIL__HOST: smtp.gmail.com
      AUTHENTIK_EMAIL__PORT: "587"
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      # Gmail rewrites any other From address
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__USERNAME}
    labels:
      traefik.enable: "true"
      traefik.http.routers.authentik.rule: "Host(`sso.${DOMAIN}`)"
      traefik.http.routers.authentik.entrypoints: "websecure"
      traefik.http.routers.authentik.tls.certresolver: "cloudflare"
      traefik.http.routers.authentik.middlewares: "secure@file"
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true

  # embedded outpost only: no docker.sock and no user: root
  authentik-worker:
    build: ./authentik
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    networks:
      - authentik
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    volumes:
      - ${APPDATA}/security/authentik/data:/data
      - ../../configs/authentik/blueprints:/blueprints/custom:ro
    environment: *authentik-env
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true
