      icon: jellyseerr
      description: Request movies and series
- Home:
  - Immich:
      href: https://photos.romulus.hu
      icon: immich
      description: Photos and videos
  - Nextcloud:
      href: https://cloud.romulus.hu
      icon: nextcloud
      description: Files and sync
  - Home Assistant:
      href: https://home.romulus.hu
      icon: home-assistant
      description: Home automation
- Talk:
  - TeamSpeak:
      href: ts3server://romulus.hu
      icon: teamspeak
      description: Voice server, connect to romulus.hu
- Media Automation:
  - Sonarr:
      href: https://sonarr.romulus.hu
      icon: sonarr
      description: Series downloads
  - Radarr:
      href: https://radarr.romulus.hu
      icon: radarr
      description: Movie downloads
  - Prowlarr:
      href: https://prowlarr.romulus.hu
      icon: prowlarr
      description: Indexers
  - Bazarr:
      href: https://bazarr.romulus.hu
      icon: bazarr
      description: Subtitles (hu, en)
  - qBittorrent:
      href: https://qbit.romulus.hu
      icon: qbittorrent
      description: Torrent client (VPN)
- Monitoring:
  - Grafana:
      href: https://grafana.romulus.hu
      icon: grafana
      description: Dashboards
  - Prometheus:
      href: https://prometheus.romulus.hu
      icon: prometheus
      description: Metrics and alerts
      widget:
        type: prometheus
        url: http://prometheus:9090
  - Uptime Kuma:
      href: https://status.romulus.hu
      icon: uptime-kuma
      description: Uptime and status page
  - Dozzle:
      href: https://logs.romulus.hu
      icon: dozzle
      description: Container logs
- Infrastructure:
  - Authentik:
      href: https://sso.romulus.hu
      icon: authentik
      description: Login, users and invitations
  - Traefik:
      href: https://traefik.romulus.hu
      icon: traefik
      description: Reverse proxy
      widget:
        type: traefik
        url: http://traefik:8080
  - AdGuard:
      href: https://dns.romulus.hu
      icon: adguard-home
      description: DNS and ad blocking
  - CrowdSec:
      icon: crowdsec
      description: Intrusion prevention
- Trading:
  - Hydra:
      href: https://trading.romulus.hu
      icon: mdi-chart-line
