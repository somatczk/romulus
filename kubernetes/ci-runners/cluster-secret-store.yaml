apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-romulus-ci
spec:
  provider:
    onepasswordSDK:
      vault: romulus-ci
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
          namespace: external-secrets
  conditions:
    # Only the runner namespaces may pull from this vault.
    - namespaces: [arc-vetoo, arc-coordentra, arc-somatczk]
