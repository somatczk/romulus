  # trading: Hydra maps Remote-User to its principal and trusts it only from Traefik's hydra-edge
  # address (HYDRA_API__TRUSTED_PROXY_CIDRS); the outpost emits it from this mapping, and the
  # authentik middleware passes it on (configs/traefik/dynamic/middlewares.yml)
  - model: authentik_providers_oauth2.scopemapping
    id: scope-remote-user
    identifiers:
      name: "Romulus: Remote-User header"
    attrs:
      scope_name: ak_proxy_remote_user
      description: Remote-User = the Authentik username, for Hydra
      expression: |
        return {"ak_proxy": {"user_attributes": {"additionalHeaders": {"Remote-User": request.user.username}}}}
  - model: authentik_providers_proxy.proxyprovider
    id: provider-trading
    identifiers:
      name: trading
    attrs:
      mode: forward_single
      external_host: https://trading.romulus.hu
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=4
      # Authelia bypassed /_next/ on every host for the Next.js dashboard; kept for its immutable build assets only
      skip_path_regex: ^/_next/static/
      # set_oauth_defaults() adds the default proxy scopes on every save
      property_mappings:
        - !KeyOf scope-remote-user
  - model: authentik_core.application
    id: app-trading
    identifiers:
      slug: trading
    attrs:
      name: Hydra
      provider: !KeyOf provider-trading
      meta_launch_url: https://trading.romulus.hu
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-trading
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-trading
      group: !Find [authentik_core.group, [name, hydra]]
      order: 1

  # hydra-mcp: OAuth 2.1 for Hydra's MCP endpoint (trading/mcp). Hydra is the resource server: it checks these
  # access tokens itself (RS256 against this provider's JWKS, iss = .../application/o/hydra-mcp/, aud = the client
  # id) and binds a service principal, so a signed-in agent never approves its own gated actions. A public
  # client with PKCE keeps a secret out of git; Authentik has no dynamic client registration, so MCP clients are
  # given the client id (Claude Code: --client-id; claude.ai connectors: the advanced OAuth client id field).
  # Not an outpost provider: Hydra validates the tokens, no forward auth sits in front of /mcp.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-hydra-mcp
    identifiers:
      name: hydra-mcp
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: hydra-mcp
      # a provider created by a blueprint allows no grant until it is listed here
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        # Claude Code's loopback callback, any port (RFC 8252)
        - matching_mode: regex
          url: ^http://(localhost|127\.0\.0\.1):[0-9]+/callback$
        # claude.ai custom connectors
        - matching_mode: strict
          url: https://claude.ai/api/mcp/auth_callback
      # RS256 JWTs Hydra verifies with this provider's JWKS (without a key Authentik signs HS256 with the secret)
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    id: app-hydra-mcp
    identifiers:
      slug: hydra-mcp
    attrs:
      name: Hydra MCP
      provider: !KeyOf provider-hydra-mcp
      # no library tile: there is nothing to open in a browser
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-hydra-mcp
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-hydra-mcp
      group: !Find [authentik_core.group, [name, hydra]]
      order: 1

  # the embedded outpost serves every provider listed here; this list is the full set
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf provider-speed
        - !KeyOf provider-traefik
        - !KeyOf provider-dns
        - !KeyOf provider-logs
        - !KeyOf provider-portainer
        - !KeyOf provider-prometheus
        - !KeyOf provider-glances
        - !KeyOf provider-sonarr
        - !KeyOf provider-radarr
        - !KeyOf provider-prowlarr
        - !KeyOf provider-bazarr
        - !KeyOf provider-lidarr
        - !KeyOf provider-qbit
        - !KeyOf provider-trading
