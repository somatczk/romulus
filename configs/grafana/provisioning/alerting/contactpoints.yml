apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-infra
        type: telegram
        settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
          chatid: "TEMPLATED_TELEGRAM_CHAT_ID"
          parse_mode: HTML
          disable_web_page_preview: true
        disableResolveMessage: false
# removed contact points stay in grafana unless deleted here
deleteContactPoints:
  - orgId: 1
    uid: ntfy-infra
