# Invitation-only enrollment, trimmed from upstream example/flows-invitation-enrollment.yaml
# (internal users only, no example invitations or groups). No login stage: the enrollee
# then signs in through the default flow, which forces TOTP enrollment (login.yaml).
version: 1
metadata:
  name: Romulus - Invitation enrollment
entries:
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: invitation-enrollment
    attrs:
      name: Invitation enrollment
      title: Welcome! Complete your enrollment
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_stages_invitation.invitationstage
    id: invitation-stage
    identifiers:
      name: invitation-enrollment-invitation
    attrs:
      continue_flow_without_invitation: false
  - model: authentik_stages_prompt.prompt
    id: prompt-field-username
    identifiers:
      name: invitation-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: prompt-field-password
    identifiers:
      name: invitation-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 1
  - model: authentik_stages_prompt.prompt
    id: prompt-field-password-repeat
    identifiers:
      name: invitation-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 2
  - model: authentik_stages_prompt.prompt
    id: prompt-field-name
    identifiers:
      name: invitation-enrollment-field-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      order: 0
  # recovery emails go here
  - model: authentik_stages_prompt.prompt
    id: prompt-field-email
    identifiers:
      name: invitation-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 1
  - model: authentik_stages_prompt.promptstage
    id: prompt-stage-credentials
    identifiers:
      name: invitation-enrollment-prompt-credentials
    attrs:
      fields:
        - !KeyOf prompt-field-username
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
  - model: authentik_stages_prompt.promptstage
    id: prompt-stage-details
    identifiers:
      name: invitation-enrollment-prompt-details
    attrs:
      fields:
        - !KeyOf prompt-field-name
        - !KeyOf prompt-field-email
  - model: authentik_stages_user_write.userwritestage
    id: user-write-stage
    identifiers:
      name: invitation-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf invitation-stage
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage-credentials
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage-details
      order: 15
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write-stage
      order: 20
