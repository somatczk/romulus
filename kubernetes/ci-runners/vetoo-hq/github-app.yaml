apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-romulus-ci
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef: {key: vetoo-ci/app_id}
    - secretKey: github_app_installation_id
      remoteRef: {key: vetoo-ci/installation_id}
    - secretKey: github_app_private_key
      remoteRef: {key: vetoo-ci/private_key}
