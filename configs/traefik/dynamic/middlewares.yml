http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"

    local-only:
      ipAllowList:
        sourceRange:
          - "192.168.0.0/24"
          - "172.22.0.0/16"
          - "10.10.0.0/16"

    crowdsec-bouncer:
      forwardAuth:
        address: http://crowdsec-bouncer:8080/api/v1/forwardAuth
        trustForwardHeader: true

    mcp-rate-limit:
      rateLimit:
        average: 10
        period: 1s
        burst: 30

    # Authentik's embedded outpost, single-application mode (configs/authentik/blueprints/applications.yaml)
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 4194304
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
          # only the trading provider's scope mapping emits it (Hydra's principal); strip-auth-headers
          # removes a client-sent one on every secure-admin-ak route first
          - Remote-User

    # A client-sent identity header must never reach an app: authResponseHeaders only replaces the
    # headers the auth response carries. "" removes the header.
    strip-auth-headers:
      headers:
        customRequestHeaders:
          Remote-User: ""
          Remote-Groups: ""
          Remote-Email: ""
          Remote-Name: ""
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-entitlements: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
          X-authentik-meta-jwks: ""
          X-authentik-meta-outpost: ""
          X-authentik-meta-provider: ""
          X-authentik-meta-app: ""
          X-authentik-meta-version: ""

    traefik-dashboard-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/$"
        replacement: "${1}/dashboard/"
        permanent: true

    secure:
      chain:
        middlewares:
          - crowdsec-bouncer
          - secure-headers

    # every admin route: crowdsec, then the client's identity headers dropped, then Authentik's forward auth
    secure-admin-ak:
      chain:
        middlewares:
          - crowdsec-bouncer
          - strip-auth-headers
          - authentik
          - secure-headers

    # D5: the MCP router's chain - bearer token at the app, no interactive login (non-interactive clients)
    secure-mcp:
      chain:
        middlewares:
          - crowdsec-bouncer
          - secure-headers
          - mcp-rate-limit
