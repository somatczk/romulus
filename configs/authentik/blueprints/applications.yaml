    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf provider-speed
        - !KeyOf provider-traefik
        - !KeyOf provider-dns
        - !KeyOf provider-logs
        - !KeyOf provider-portainer
        - !KeyOf provider-prometheus
        - !KeyOf provider-glances
        - !KeyOf provider-sonarr
        - !KeyOf provider-radarr
        - !KeyOf provider-prowlarr
        - !KeyOf provider-bazarr
        - !KeyOf provider-lidarr
        - !KeyOf provider-qbit
