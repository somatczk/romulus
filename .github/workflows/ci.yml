name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# bash -eo pipefail, so a failing producer in a pipe fails the step
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Config
        uses: ./.github/actions/validate-config

  validate-dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        run: |
          ERRORS=0
          while IFS= read -r dockerfile; do
            echo "Checking: $dockerfile"

            # Must be exactly one FROM line
            from_count=$(grep -c '^FROM ' "$dockerfile" || true)
            if [[ "$from_count" -ne 1 ]]; then
              echo "  ERROR: Expected 1 FROM line, found $from_count"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Extract the tag
            tag=$(grep '^FROM ' "$dockerfile" | sed 's/FROM [^:]*://' | sed 's/ .*//')
            if [[ -z "$tag" ]]; then
              echo "  ERROR: No tag specified"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Must not use unpinned tags
            if [[ "$tag" == "latest" || "$tag" == "stable" || "$tag" == "release" ]]; then
              echo "  ERROR: Unpinned tag '$tag', must use a specific version"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "  OK (tag: $tag)"
          done < <(find stacks -name Dockerfile)

          if [[ $ERRORS -gt 0 ]]; then
            echo ""
            echo "Found $ERRORS Dockerfile validation error(s)"
            exit 1
          fi
          echo ""
          echo "All Dockerfiles are valid"

  verify-images:
    name: Verify Changed Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the diff below needs the merge base
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed Dockerfiles
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- 'stacks/*/Dockerfile' 'stacks/*/*/Dockerfile' 'images/*/Dockerfile')
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${FILES:-No Dockerfile changes detected}"

      - name: Verify images exist
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          ERRORS=0
          while IFS= read -r dockerfile; do
            [[ -f "$dockerfile" ]] || continue
            while read -r image; do
              if docker buildx imagetools inspect "$image" >/dev/null; then
                echo "OK    $image ($dockerfile)"
              else
                echo "ERROR $image ($dockerfile)"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(awk '/^FROM /{print $2}' "$dockerfile")
          done <<< "$FILES"
          [[ $ERRORS -eq 0 ]] || { echo "Failed to verify $ERRORS image(s)"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT: 1.7.12
      ACTIONLINT_SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      KUBECONFORM: 0.8.0
      KUBECONFORM_SHA: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      GITLEAKS: 8.30.1
      GITLEAKS_SHA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ZIZMOR: 1.31.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"; cd "$RUNNER_TEMP"
          fetch() { curl -fsSLo "$1" "$2" && echo "$3  $1" | sha256sum -c - && tar -xzf "$1" -C bin "$4"; }
          fetch al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" "$ACTIONLINT_SHA" actionlint
          fetch kc.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA" kubeconform
          fetch gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" "$GITLEAKS_SHA" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR}" --min-severity medium .github/

      # same promtool as the deployed prometheus image
      - name: prometheus rules
        run: |
          IMG=$(awk '/^FROM /{print $2}' stacks/monitoring/prometheus/Dockerfile)
          promtool() { docker run --rm -v "$PWD/configs/prometheus:/p:ro" --entrypoint promtool "$IMG" "$@"; }
          promtool check rules /p/alert-rules.yml /p/hydra-alert-rules.yml
          promtool test rules /p/tests/hydra-alert-rules.test.yml

      # hydra main owns these files; fails on drift when the PR touches one or bumps a hydra image
      - name: hydra rules and dashboard in sync
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bash .github/tests/hydra-sync-test.sh
          git diff --name-only "origin/$BASE_REF...HEAD" | bash .github/tests/hydra-sync.sh

      - name: dependabot auto-merge hold logic
        run: |
          shellcheck .github/tests/*.sh
          bash .github/tests/dependabot-hold.sh

      - name: no public hydra or metrics routers
        run: bash .github/tests/traefik-exposure.sh

      - name: hydra credential key and no exchange env
        run: bash .github/tests/hydra-env.sh

      - name: kubeconform
        run: |
          for d in clusters/romulus kubernetes/infrastructure kubernetes/tenants-source; do
            echo "== $d"
            kubectl kustomize "$d" | kubeconform -strict -summary -skip CustomResourceDefinition \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      # every stack doco-cd deploys must render with host.env and only the secrets it lists
      - name: doco-cd stacks render
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, yaml
          bad = 0
          for d in yaml.safe_load_all(open(".doco-cd.yml")):
              env = {k: "x" for k in (d.get("external_secrets") or {})}
              env.update(PATH=os.environ["PATH"], HOME=os.environ["HOME"])
              r = subprocess.run(["docker", "compose", "--env-file", "../host.env", "config", "-q"],
                                 cwd=d["working_dir"], env=env, capture_output=True, text=True)
              unset = [l for l in r.stderr.splitlines() if "not set" in l]
              if r.returncode or unset:
                  bad += 1
                  print(f"::error::{d['name']}: {r.stderr.strip()}")
          sys.exit(bad)
          PY
          docker compose -f host/doco-cd/compose.yml config -q

      - name: gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gitleaks git --no-banner --redact --log-opts="origin/$BASE_REF..HEAD" .
