networks:
  ci:
    external: true
  ci-socket:
    driver: bridge
  # internet egress for buildkitd + mirror only (ci is internal)
  ci-egress:
    driver: bridge

# Shared runner env. RUNNER_WORKDIR is set PER SERVICE to a host-aligned path
# (/DATA/ci/runners/<name>, mounted at the identical path inside the container).
# Required because the host root is a read-only squashfs: docker:// container
# actions run as sibling containers via the socket proxy, so their bind-mount
# source paths must be real host paths. An in-container-only /work cannot be
# created on the read-only host root -> "mkdir /work: read-only file system".
x-env-common: &env-common
  DOCKER_HOST: tcp://ci-socket-proxy:2375
  DOCKER_CONFIG: /tmp/.docker
  TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
  ACCESS_TOKEN: ${GITHUB_PAT}
  EPHEMERAL: "true"
  DISABLE_AUTO_UPDATE: "true"
  npm_config_store_dir: /cache/pnpm
  MAVEN_OPTS: -Dmaven.repo.local=/cache/m2
  RUNNER_TOOL_CACHE: /cache/toolcache
  AGENT_TOOLSDIRECTORY: /cache/toolcache
  # no CPU ceiling on tiered runners: node sees all 32 host cores, so cap
  # vitest pools or fork fan-out OOMs the 6G memcg
  VITEST_MAX_FORKS: 4
  TURBO_CONCURRENCY: 4
  VITEST_MAX_THREADS: 4

# Org tiers: all keep org-vetoo-hq; workflows opt in via heavy/light label.
x-org-heavy-env: &org-heavy-env
  <<: *env-common
  RUNNER_SCOPE: org
  ORG_NAME: ${GITHUB_ORG}
  RUNNER_NAME_PREFIX: zimaos-heavy
  LABELS: self-hosted,linux,x64,zimaos,org-vetoo-hq,heavy

x-org-light-env: &org-light-env
  <<: *env-common
  RUNNER_SCOPE: org
  ORG_NAME: ${GITHUB_ORG}
  RUNNER_NAME_PREFIX: zimaos-light
  LABELS: self-hosted,linux,x64,zimaos,org-vetoo-hq,light

x-org-heavy-coord-env: &org-heavy-coord-env
  <<: *env-common
  RUNNER_SCOPE: org
  ORG_NAME: ${GITHUB_ORG_COORDENTRA}
  RUNNER_NAME_PREFIX: zimaos-coord-heavy
  LABELS: self-hosted,linux,x64,zimaos,org-coordentra,heavy

x-org-light-coord-env: &org-light-coord-env
  <<: *env-common
  RUNNER_SCOPE: org
  ORG_NAME: ${GITHUB_ORG_COORDENTRA}
  RUNNER_NAME_PREFIX: zimaos-coord-light
  LABELS: self-hosted,linux,x64,zimaos,org-coordentra,light

x-solhouse-env: &solhouse-env
  <<: *env-common
  RUNNER_SCOPE: repo
  REPO_URL: https://github.com/somatczk/solhouse-nextjs
  RUNNER_NAME_PREFIX: zimaos-solhouse
  LABELS: self-hosted,linux,x64,zimaos,solhouse

x-hydra-env: &hydra-env
  <<: *env-common
  RUNNER_SCOPE: repo
  REPO_URL: https://github.com/somatczk/hydra
  RUNNER_NAME_PREFIX: zimaos-hydra
  LABELS: self-hosted,linux,x64,zimaos,hydra

x-romulus-env: &romulus-env
  <<: *env-common
  RUNNER_SCOPE: repo
  REPO_URL: https://github.com/somatczk/romulus
  RUNNER_NAME_PREFIX: zimaos-romulus
  LABELS: self-hosted,linux,x64,zimaos,romulus

x-runner-base: &runner-base
  build: ./gh-runner
  image: ci-gh-runner:current
  env_file: ./ci.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - ci
    - ci-socket
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Heavy: maven/docker builds. Shares not caps: bursts when idle, 768 < the
# homelab default 1024 so homelab wins under contention.
x-runner-heavy: &runner-heavy
  <<: *runner-base
  cpu_shares: 768
  deploy:
    resources:
      limits:
        memory: 12G

# Light: tf plans/lint. 6G until consumers request tier labels, then 2G.
x-runner-light: &runner-light
  <<: *runner-base
  cpu_shares: 512
  deploy:
    resources:
      limits:
        memory: 6G

x-runner-repo: &runner-repo
  <<: *runner-base
  deploy:
    resources:
      limits:
        memory: 6G
        cpus: "4.0"

services:
  ci-socket-proxy:
    build: ./socket-proxy
    container_name: ci-socket-proxy
    restart: unless-stopped
    networks:
      - ci-socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      VOLUMES: 1
      POST: 1
      BUILD: 1
      COMMIT: 0
      AUTH: 1
      DISTRIBUTION: 1
      EXEC: 1
      EVENTS: 1
      INFO: 1
      LOG_LEVEL: warning
    deploy:
      resources:
        limits:
          memory: 128m
    security_opt:
      - no-new-privileges:true

  # Shared BuildKit daemon: one persistent layer cache for all CI builds.
  ci-buildkitd:
    image: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    container_name: ci-buildkitd
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    networks:
      - ci
      - ci-egress
    volumes:
      - /DATA/ci/buildkit:/var/lib/buildkit
      - ./buildkitd/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    cpu_shares: 768
    deploy:
      resources:
        limits:
          memory: 16G
    restart: unless-stopped

  # Docker Hub pull-through cache (dockerd + buildkitd); weekly GC.
  ci-registry-mirror:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: ci-registry-mirror
    restart: unless-stopped
    networks:
      - ci
      - ci-egress
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - /DATA/ci/registry-mirror:/var/lib/registry
    deploy:
      resources:
        limits:
          memory: 512m

  gh-runner-coord-heavy-1:
    <<: *runner-heavy
    container_name: gh-runner-coord-heavy-1
    environment:
      <<: *org-heavy-coord-env
      RUNNER_WORKDIR: /DATA/ci/runners/runner-coord-heavy-1
    volumes:
      - /DATA/ci/runners/runner-coord-heavy-1:/DATA/ci/runners/runner-coord-heavy-1
      - /DATA/ci/cache:/cache
      - /DATA/ci/cache:/DATA/ci/cache

  gh-runner-coord-light-1:
