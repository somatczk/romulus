version: 2

registries:
  ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: somatczk
    password: ${{secrets.G_PAT}}

updates:
  # Workflows and the composite actions under .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    # Majors stay separate so auto-merge can hold them back.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"

  # One single-line Dockerfile per service (stacks/<stack>/<service>) plus built images.
  - package-ecosystem: docker
    registries: [ghcr]
    directories:
      - /stacks/*/*
      - /images/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels: [dependencies, docker]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "docker"

  # Images referenced directly from compose files.
  - package-ecosystem: docker-compose
    directories:
      - /stacks/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  # Container images in the Flux-managed Kubernetes manifests and Helm values.
  # Chart versions in HelmReleases are not covered by Dependabot; bump them by hand.
  - package-ecosystem: docker
    directories:
      - /kubernetes/**
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels: [dependencies, kubernetes]
    commit-message:
      prefix: "k8s"
