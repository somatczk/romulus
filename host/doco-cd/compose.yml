# doco-cd: pulls master and deploys the stacks listed in /.doco-cd.yml.
# Runs outside its own deployments; scripts/install-gitops.sh starts and updates it.
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.132.0@sha256:ed22583456c60c88c5cabdb47803aa0ab51284f00d70d5bb63fa56b223fa250a
    container_name: doco-cd
    restart: unless-stopped
    depends_on:
      apprise:
        condition: service_healthy
      connect-api:
        condition: service_started
    networks:
      - doco-cd
      # prometheus scrapes :9120
      - monitoring
    environment:
      TZ: Europe/Budapest
      LOG_LEVEL: info
      POLL_CONFIG: |
        - url: https://github.com/somatczk/romulus.git
          reference: refs/heads/master
          interval: 60
      # every poll re-resolves all secrets; Connect serves them from its synced copy,
      # so there is no 1Password rate limit and a rotated secret lands on the next poll
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_CONNECT_HOST: http://connect-api:8080
      SECRET_PROVIDER_CONNECT_TOKEN_FILE: /run/secrets/connect-token
      # per-stack commit statuses (doco-cd/<stack>) on master commits; fine-grained PAT scoped to
      # somatczk/romulus: Contents read, Commit statuses read/write. The repo stays public, the token only reports.
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git-token
      # a YAML list of {domains: [...]}; a bare hostname fails config parsing and doco-cd crash-loops
      GIT_AUTH_DOMAINS: "- domains: [github.com]"
      GIT_SCM_PROVIDER: github
      GIT_COMMIT_STATUS: "true"
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise-urls
      # minimum level: success also sends warnings and failures
      APPRISE_NOTIFY_LEVEL: success
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/doco-cd/data:/data
      - /DATA/doco-cd/connect-token:/run/secrets/connect-token:ro
      - /DATA/doco-cd/apprise-urls:/run/secrets/apprise-urls:ro
      - /DATA/doco-cd/git-token:/run/secrets/git-token:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

  # 1Password Connect: keeps a synced copy of the romulus-deploy vault and serves it locally
  connect-api:
    image: 1password/connect-api:1.8.4@sha256:0f74924c55c9156b8116f59f485223b2c2d30a5148d362562aa27838159bdffa
    container_name: op-connect-api
    restart: unless-stopped
    networks:
      - doco-cd
    volumes: &connect-volumes
      # owned by uid 999 (opuser), mode 600
      - /DATA/doco-cd/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - connect-data:/home/opuser/.op/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  connect-sync:
    image: 1password/connect-sync:1.8.4@sha256:ca34850f2a20ca302e688a9347cdb696f29ce3bfc011d2554eff338e315c9089
    container_name: op-connect-sync
    restart: unless-stopped
    networks:
      - doco-cd
    volumes: *connect-volumes
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  apprise:
    image: caronc/apprise:2.0.2@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
    container_name: doco-cd-apprise
    restart: unless-stopped
    networks:
      - doco-cd
      # reaches ntfy
      - monitoring
    environment:
      TZ: Europe/Budapest
      APPRISE_WORKER_COUNT: 1
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  connect-data:

networks:
  doco-cd:
    name: doco-cd
  monitoring:
    external: true
