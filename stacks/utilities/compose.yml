networks:
  proxy:
    external: true
  socket:
    external: true
  monitoring:
    external: true
  ts-db:
    driver: bridge

services:
  dozzle:
    build: ./dozzle
    container_name: dozzle
    networks:
      - proxy
      - socket
    environment:
      TZ: ${TZ}
      DOCKER_HOST: tcp://socket-proxy:2375
    labels:
      traefik.enable: "true"
      traefik.http.routers.logs.rule: Host(`logs.${DOMAIN}`)
      traefik.http.routers.logs.entrypoints: websecure
      traefik.http.routers.logs.tls.certresolver: cloudflare
      traefik.http.routers.logs.middlewares: secure-admin-ak@file
      traefik.http.services.logs.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  speedtest-exporter:
    build: ./speedtest-exporter
    container_name: speedtest-exporter
    networks:
      - monitoring
      - proxy
    ports:
      - "9798:9798"
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  teamspeak-db:
    build: ./teamspeak-db
    container_name: teamspeak-db
    networks:
      - ts-db
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${TEAMSPEAK_DB_PASSWORD}
      MYSQL_DATABASE: teamspeak
      MYSQL_USER: teamspeak
      MYSQL_PASSWORD: ${TEAMSPEAK_DB_PASSWORD}
    volumes:
      - ${APPDATA}/utilities/teamspeak-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  teamspeak:
    build: ./teamspeak
    container_name: teamspeak
    depends_on:
      teamspeak-db:
        condition: service_healthy
    networks:
      - proxy
      - ts-db
    ports:
      - "9987:9987/udp"
      - "30033:30033/tcp"
    environment:
      TZ: ${TZ}
      TS3SERVER_DB_PLUGIN: ts3db_mariadb
      TS3SERVER_DB_SQLCREATEPATH: create_mariadb
      TS3SERVER_DB_HOST: teamspeak-db
      TS3SERVER_DB_USER: teamspeak
      TS3SERVER_DB_PASSWORD: ${TEAMSPEAK_DB_PASSWORD}
      TS3SERVER_DB_NAME: teamspeak
      TS3SERVER_DB_WAITUNTILREADY: "30"
      TS3SERVER_LICENSE: accept
      # WebQuery (REST ServerQuery admin API, x-api-key) on 10080; teamspeak.${DOMAIN} is LAN-only (local-only)
      TS3SERVER_QUERY_PROTOCOLS: raw,http
    volumes:
      - ${APPDATA}/utilities/teamspeak:/var/ts3server
    tmpfs:
      - /var/run/ts3server:uid=9987,gid=9987
    labels:
      traefik.enable: "true"
      traefik.http.routers.teamspeak.rule: Host(`teamspeak.${DOMAIN}`)
      traefik.http.routers.teamspeak.entrypoints: websecure
      traefik.http.routers.teamspeak.tls.certresolver: cloudflare
      traefik.http.routers.teamspeak.middlewares: secure@file,local-only@file
      traefik.http.services.teamspeak.loadbalancer.server.port: "10080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10011"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  autoheal:
    build: ./autoheal
    container_name: autoheal
    restart: unless-stopped
    networks:
      - socket
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 300
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges:true
