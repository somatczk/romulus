spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  valuesFrom:
    - kind: ConfigMap
      name: runner-values-light
      valuesKey: values.yaml
  values:
    githubConfigUrl: https://github.com/coordentra
    runnerScaleSetName: coordentra-light
