networks:
  proxy:
    external: true
  monitoring:
    external: true

services:
  crowdsec:
    build: ./crowdsec
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    volumes:
      - ${APPDATA}/security/crowdsec/config:/etc/crowdsec
      - ${APPDATA}/security/crowdsec/db:/var/lib/crowdsec/data
      - ${APPDATA}/security/crowdsec/hub:/etc/crowdsec/hub
      - /var/log:/var/log:ro
    environment:
      TZ: ${TZ}
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik crowdsecurity/nextcloud"
      GID: "${PGID}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt:
      - no-new-privileges:true

  crowdsec-bouncer:
    build: ./crowdsec-bouncer
    container_name: crowdsec-bouncer
    restart: unless-stopped
    networks:
      - proxy
    environment:
      TZ: ${TZ}
      CROWDSEC_BOUNCER_API_KEY: "${CROWDSEC_BOUNCER_API_KEY:-changeme_crowdsec_bouncer_key}"
      CROWDSEC_AGENT_HOST: "crowdsec:8080"
      GIN_MODE: "release"
    depends_on:
      - crowdsec
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          memory: 128m
    security_opt:
      - no-new-privileges:true
