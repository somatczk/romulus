# doco-cd: pulls master and deploys the stacks listed in /.doco-cd.yml.
# Runs outside its own deployments; scripts/install-gitops.sh starts and updates it.
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.130.0@sha256:174e1a8d6c239d67e127e89f9a89842119b7a6c13be8e16bfe468e31b1dd6240
    container_name: doco-cd
    restart: unless-stopped
    depends_on:
      apprise:
        condition: service_healthy
      connect-api:
        condition: service_started
    networks:
      - doco-cd
      # prometheus scrapes :9120
      - monitoring
    environment:
      TZ: Europe/Budapest
      LOG_LEVEL: info
      POLL_CONFIG: |
        - url: https://github.com/somatczk/romulus.git
          reference: refs/heads/master
          interval: 60
      # every poll re-resolves all secrets; Connect serves them from its synced copy,
      # so there is no 1Password rate limit and a rotated secret lands on the next poll
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_CONNECT_HOST: http://connect-api:8080
      SECRET_PROVIDER_CONNECT_TOKEN_FILE: /run/secrets/connect-token
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise-urls
      # minimum level: success also sends warnings and failures
      APPRISE_NOTIFY_LEVEL: success
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/doco-cd/data:/data
      - /DATA/doco-cd/connect-token:/run/secrets/connect-token:ro
      - /DATA/doco-cd/apprise-urls:/run/secrets/apprise-urls:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

  # 1Password Connect: keeps a synced copy of the romulus-deploy vault and serves it locally
  connect-api:
    image: 1password/connect-api:1.8.3@sha256:656e4b10df83ca258d8a75b2a051f7c06dd608212f8ae5ba4722e3fe164099d3
    container_name: op-connect-api
    restart: unless-stopped
    networks:
      - doco-cd
    volumes: &connect-volumes
      # owned by uid 999 (opuser), mode 600
      - /DATA/doco-cd/1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
      - connect-data:/home/opuser/.op/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  connect-sync:
    image: 1password/connect-sync:1.8.3@sha256:a760350c941a3e7c98dd66394e9fc3c7e68b6a0a2246a837c74084e534f75f6b
    container_name: op-connect-sync
    restart: unless-stopped
    networks:
      - doco-cd
    volumes: *connect-volumes
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  apprise:
    image: caronc/apprise:2.0.1@sha256:0b2913b15c8eb47c25345722985ffbfae701326edde21909c205d296d62dd52c
    container_name: doco-cd-apprise
    restart: unless-stopped
    networks:
      - doco-cd
      # reaches ntfy
      - monitoring
    environment:
      TZ: Europe/Budapest
      APPRISE_WORKER_COUNT: 1
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  connect-data:

networks:
  doco-cd:
    name: doco-cd
  monitoring:
    external: true
