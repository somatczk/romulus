networks:
  proxy:
    external: true
  db-nextcloud:
    external: true
  db-immich:
    external: true

services:
  # ---------------------------------------------------------------------------
  # Nextcloud Group
  # ---------------------------------------------------------------------------
  nextcloud-db:
    build: ./postgres
    container_name: nextcloud-db
    restart: unless-stopped
    networks:
      - db-nextcloud
    environment:
      TZ: ${TZ}
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ${APPDATA}/productivity/nextcloud-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true

  nextcloud-redis:
    build: ./redis
    container_name: nextcloud-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - db-nextcloud
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASSWORD}
    volumes:
      - ${APPDATA}/productivity/nextcloud-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEXTCLOUD_REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true

  nextcloud:
    build: ./nextcloud
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - proxy
      - db-nextcloud
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.${DOMAIN} nextcloud"
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.${DOMAIN}
    volumes:
      - ${APPDATA}/productivity/nextcloud/html:/var/www/html
      - ${APPDATA}/productivity/nextcloud/data:/var/www/html/data
      - ${APPDATA}/productivity/immich/upload:/media/immich-photos:ro  # Immich photos (read-only)
    labels:
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: "Host(`cloud.${DOMAIN}`)"
      traefik.http.routers.nextcloud.entrypoints: "websecure"
      traefik.http.routers.nextcloud.tls.certresolver: "cloudflare"
      traefik.http.routers.nextcloud.service: "nextcloud"
      traefik.http.routers.nextcloud.middlewares: "secure@file"
      traefik.http.services.nextcloud.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Immich Group
  # ---------------------------------------------------------------------------
  immich-db:
    build: ./immich-db
    container_name: immich-db
    restart: unless-stopped
    networks:
      - db-immich
    environment:
      TZ: ${TZ}
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${APPDATA}/productivity/immich/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true

  immich-redis:
    build: ./redis
    container_name: immich-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - db-immich
    volumes:
      - ${APPDATA}/productivity/immich/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true

  immich-server:
    build: ./immich-server
    container_name: immich-server
    restart: unless-stopped
    networks:
      - proxy
      - db-immich
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-ml:3003
      UPLOAD_LOCATION: /photos
    volumes:
      - ${HDD}/media/photos:/photos
      - ${APPDATA}/productivity/immich/upload:/usr/src/app/upload
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: "Host(`photos.${DOMAIN}`)"
      traefik.http.routers.immich.entrypoints: "websecure"
      traefik.http.routers.immich.tls.certresolver: "cloudflare"
      traefik.http.routers.immich.service: "immich"
      traefik.http.routers.immich.middlewares: "secure@file"
      traefik.http.services.immich.loadbalancer.server.port: "2283"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
    security_opt:
      - no-new-privileges:true

  immich-ml:
    build: ./immich-ml
    container_name: immich-ml
    restart: unless-stopped
    networks:
      - db-immich
    runtime: nvidia
    environment:
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${APPDATA}/productivity/immich/ml-cache:/cache
    deploy:
      resources:
        limits:
          memory: 8g
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Home Assistant
  # ---------------------------------------------------------------------------
  # NOTE: Home Assistant uses network_mode: host, which means it cannot be
  # attached to Docker networks or use Traefik labels for routing.
  # To expose Home Assistant via Traefik, use the Traefik file provider:
  #   configs/traefik/dynamic/homeassistant.yml with a service URL of
  #   http://<host-ip>:8123. See Traefik docs for file provider configuration.
  homeassistant:
    build: ./homeassistant
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/productivity/homeassistant:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

