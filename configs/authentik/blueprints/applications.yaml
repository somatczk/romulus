# One application + forward_single proxy provider per protected host (Traefik forward auth to the
# embedded outpost); group bindings decide who gets in. Phase 3: every admin host; trading also lets in hydra.
# One OAuth2 provider (hydra-mcp) issues the access tokens Hydra's MCP endpoint checks itself.
version: 1
metadata:
  name: Romulus - Applications
entries:
