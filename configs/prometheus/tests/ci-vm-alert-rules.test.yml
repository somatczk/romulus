rule_files:
  - ../alert-rules.yml

evaluation_interval: 30s

tests:
  - name: unresponsive VM fires after 5 minutes
    interval: 1m
    input_series:
      - series: 'homelab_ci_vm_up{instance="node-exporter:9100", job="node-exporter"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: CiVmUnresponsive
        exp_alerts: []
      - eval_time: 8m
        alertname: CiVmUnresponsive
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              job: node-exporter
            exp_annotations:
              summary: "The CI VM is not answering"
              description: "romulus-ci's k3s API has not replied for 5 minutes; GitHub Actions runners are offline. Check: sudo virsh domstate romulus-ci; sudo virsh reset romulus-ci if it is hung."

  - name: answering VM does not fire
    interval: 1m
    input_series:
      - series: 'homelab_ci_vm_up{instance="node-exporter:9100", job="node-exporter"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: CiVmUnresponsive
        exp_alerts: []

  - name: a probe that stops writing goes stale
    interval: 1m
    input_series:
      - series: 'homelab_ci_vm_probe_timestamp{instance="node-exporter:9100", job="node-exporter"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: CiVmProbeStale
        exp_alerts: []
      - eval_time: 20m
        alertname: CiVmProbeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              job: node-exporter
            exp_annotations:
              summary: "The CI VM probe is not running"
              description: "scripts/ci-vm/probe.sh has not written a result in 10 minutes. Check: sudo crontab -l"
