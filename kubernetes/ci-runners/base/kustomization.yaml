apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - buildkitd.yaml
  - cache.yaml
  - network-policy.yaml
configMapGenerator:
  - name: runner-values-heavy
    files:
      - values.yaml=runner-values-heavy.yaml
    options:
      disableNameSuffixHash: true
  - name: runner-values-light
    files:
      - values.yaml=runner-values-light.yaml
    options:
      disableNameSuffixHash: true
