name: hydra-sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # catches hydra main moving between romulus PRs
  drift:
    name: Hydra rules and dashboard match hydra main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: diff against hydra main
        run: bash .github/tests/hydra-sync.sh --strict
