apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ci-runners
  namespace: flux-system
spec:
  dependsOn:
    - name: tenants-source
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: romulus-tenants
  path: ./ci-runners
