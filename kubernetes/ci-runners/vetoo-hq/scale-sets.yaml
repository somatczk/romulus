apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vetoo-heavy
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  valuesFrom:
    - kind: ConfigMap
      name: runner-values-heavy
      valuesKey: values.yaml
  values:
    githubConfigUrl: https://github.com/vetoo-hq
    runnerScaleSetName: vetoo-heavy
    scaleSetLabels: [self-hosted, linux, x64, zimaos, org-vetoo-hq, heavy]
    # One warm pod hides the cold start on the busiest tier.
    minRunners: 1
    maxRunners: 4
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vetoo-light
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  valuesFrom:
    - kind: ConfigMap
      name: runner-values-light
      valuesKey: values.yaml
  values:
    githubConfigUrl: https://github.com/vetoo-hq
    runnerScaleSetName: vetoo-light
    scaleSetLabels: [self-hosted, linux, x64, zimaos, org-vetoo-hq, light]
    maxRunners: 8
