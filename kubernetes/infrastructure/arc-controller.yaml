apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: arc
  namespace: arc-systems
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc
  install:
    crds: CreateReplace
    remediation: {retries: 3}
  upgrade:
    crds: CreateReplace
    remediation: {retries: 3}
  values:
    replicaCount: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
