# doco-cd deployments. Stacks deploy independently and in parallel, no ordering between them;
# shared networks are created by scripts/install-gitops.sh.
# name must stay equal to the existing compose project name, doco-cd adopts by name.
# Secrets come from the romulus-deploy vault; host.env holds the non-secret settings.
# Stacks not listed here are not deployed.
name: core
working_dir: stacks/core
env_files:
  - ../host.env
external_secrets:
  CF_API_TOKEN: op://romulus-deploy/core/CF_API_TOKEN
---
name: security
working_dir: stacks/security
# 2026-11-01: retries after a timed-out deploy force-recreated the whole stack and left CrowdSec and
# the bouncer in Created (every route 403); 10m keeps a slow cold start from looping
timeout: 10m
env_files:
  - ../host.env
external_secrets:
  CROWDSEC_BOUNCER_API_KEY: op://romulus-deploy/security/CROWDSEC_BOUNCER_API_KEY
---
name: authentik
working_dir: stacks/authentik
# the worker needs ~3-4 min to its first healthy check on a cold start; the 3m default loops
timeout: 10m
env_files:
  - ../host.env
# still the security item in 1Password: the stack moved, the secrets did not
external_secrets:
  AUTHENTIK_BOOTSTRAP_PASSWORD: op://romulus-deploy/security/AUTHENTIK_BOOTSTRAP_PASSWORD
  AUTHENTIK_EMAIL__PASSWORD: op://romulus-deploy/security/AUTHENTIK_EMAIL__PASSWORD
  AUTHENTIK_EMAIL__USERNAME: op://romulus-deploy/security/AUTHENTIK_EMAIL__USERNAME
  AUTHENTIK_PG_PASS: op://romulus-deploy/security/AUTHENTIK_PG_PASS
  AUTHENTIK_SECRET_KEY: op://romulus-deploy/security/AUTHENTIK_SECRET_KEY
