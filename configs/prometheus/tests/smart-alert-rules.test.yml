rule_files:
  - ../alert-rules.yml

evaluation_interval: 30s

tests:
  - name: blind exporter fires after an hour, healthy disks do not fire
    interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{device="sda"}'
        values: "1x30 _x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: SmartMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: SmartDeviceFailing
        exp_alerts: []
      - eval_time: 95m
        alertname: SmartMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No SMART data from smartctl-exporter"
              description: "Disk health alerts cannot fire. Check: docker logs smartctl-exporter (permission denied means it is not running as root)."

  - name: failing disk and new media errors fire
    interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{device="sda"}'
        values: "1 0x5"
      - series: 'smartctl_device_media_errors{device="nvme0"}'
        values: "0 0 3x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: SmartDeviceFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              device: sda
            exp_annotations:
              summary: "SMART health check failed on sda"
              description: "sda reports a failing SMART overall-health status. Back up and replace the disk. Check: sudo smartctl -a /dev/sda"
      - eval_time: 4m
        alertname: SmartMediaErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              device: nvme0
            exp_annotations:
              summary: "New media errors on nvme0"
              description: "nvme0 logged 3 new media error(s) in the last hour."
