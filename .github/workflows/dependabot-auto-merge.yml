name: Dependabot Auto-Merge

on:
  # runs in base context and never checks out PR code; inputs go through env
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # Patch and minor bumps merge on green CI; majors wait for a human.
      - name: Merge non-major update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          read -r PR TITLE < <(gh pr list --head "$HEAD_BRANCH" --author 'app/dependabot' \
            --json number,title --jq '.[0] | "\(.number) \(.title)"')
          [ -n "${PR:-}" ] || { echo "no open Dependabot PR for $HEAD_BRANCH"; exit 0; }
          # Groups only carry minor/patch updates (see dependabot.yml). Anything else must
          # show "from X to Y" with the same major, or it waits for a human.
          if [[ "$TITLE" == *" group "* ]]; then
            :
          elif [[ "$TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && \
               [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
            :
          else
            echo "not a recognisable minor/patch bump, leaving #$PR for review: $TITLE"
            exit 0
          fi
          gh pr merge "$PR" --merge --delete-branch
