apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: solhouse
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  valuesFrom:
    - kind: ConfigMap
      name: runner-values-light
      valuesKey: values.yaml
  values:
    githubConfigUrl: https://github.com/somatczk/solhouse-nextjs
    runnerScaleSetName: solhouse
    scaleSetLabels: [self-hosted, linux, x64, zimaos, solhouse]
    maxRunners: 2
