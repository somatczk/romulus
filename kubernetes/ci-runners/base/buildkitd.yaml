# Per-org BuildKit daemon under the name workflows already use (ci-buildkitd:1234).
# GC keeps 40GiB on the 60Gi volume so a burst between GC runs still fits.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
data:
  buildkitd.toml: |
    [worker.oci]
      enabled = true
      gc = true
      max-parallelism = 8
      [[worker.oci.gcpolicy]]
        keepDuration = 1209600
        maxUsedSpace = "40GB"
      [[worker.oci.gcpolicy]]
        all = true
        maxUsedSpace = "40GB"
    [registry."docker.io"]
      mirrors = ["registry-mirror.ci-shared.svc.cluster.local:5000"]
    [registry."registry-mirror.ci-shared.svc.cluster.local:5000"]
      http = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ci-buildkitd}
  template:
    metadata:
      labels: {app: ci-buildkitd}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          args: ["--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
          securityContext:
            privileged: true
          ports:
            - containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "8", memory: 12Gi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/buildkit}
            - {name: config, mountPath: /etc/buildkit}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: buildkit-state}
        - name: config
          configMap: {name: buildkitd-config}
---
apiVersion: v1
kind: Service
metadata:
  name: ci-buildkitd
spec:
  selector: {app: ci-buildkitd}
  ports:
    - port: 1234
      targetPort: 1234
