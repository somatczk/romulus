services:
  jellyfin:
    build: ./jellyfin
    container_name: jellyfin
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/jellyfin/config:/config
      - ${APPDATA}/media/jellyfin/cache:/cache
      - ${HDD}/data/media/movies:/data/movies
      - ${HDD}/data/media/series:/data/series
      - ${HDD}/data/media/music:/data/music
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      - traefik.http.routers.jellyfin.middlewares=secure-headers@file
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  sonarr:
    build: ./sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/sonarr:/config
      - ${HDD}/data:/data
      # ponytail: legacy path for torrents added before the /data move; drop once they finish seeding
      - ${HDD}/data/downloads:/downloads
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.routers.sonarr.middlewares=secure-admin-ak@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  radarr:
    build: ./radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/radarr:/config
      - ${HDD}/data:/data
      # ponytail: legacy path for torrents added before the /data move; drop once they finish seeding
      - ${HDD}/data/downloads:/downloads
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.routers.radarr.middlewares=secure-admin-ak@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  flaresolverr:
    build: ./flaresolverr
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    networks:
      - media
      - proxy
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prowlarr:
    build: ./prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/prowlarr:/config
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
      - traefik.http.routers.prowlarr.middlewares=secure-admin-ak@file
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  bazarr:
    build: ./bazarr
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/bazarr:/config
      - ${HDD}/data/media:/data/media
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=cloudflare
      - traefik.http.routers.bazarr.middlewares=secure-admin-ak@file
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  lidarr:
    build: ./lidarr
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/lidarr:/config
      - ${HDD}/data:/data
      # ponytail: legacy path for torrents added before the /data move; drop once they finish seeding
      - ${HDD}/data/downloads:/downloads
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls.certresolver=cloudflare
      - traefik.http.routers.lidarr.middlewares=secure-admin-ak@file
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # VPN gateway for qbittorrent: its kill switch blocks any traffic outside the tunnel.
  # NordVPN has no port forwarding, so there is no inbound torrent port.
  gluetun:
    build: ./gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
    networks:
      proxy:
      media:
        # the arrs and prowlarr reach qbittorrent:8080 through this alias
        aliases:
          - qbittorrent
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbit.rule=Host(`qbit.${DOMAIN}`)
      - traefik.http.routers.qbit.entrypoints=websecure
      - traefik.http.routers.qbit.tls.certresolver=cloudflare
      - traefik.http.routers.qbit.middlewares=secure-admin-ak@file
      - traefik.http.services.qbit.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qbittorrent:
    build: ./qbittorrent
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - QBT_WEBUI_PASSWORD=${QBIT_WEBUI_PASSWORD}
    volumes:
      - ${APPDATA}/media/qbittorrent:/config
      # downloads only: the library stays out of reach of the torrent client
      - ${HDD}/data/downloads:/data/downloads
      # ponytail: legacy path for torrents added before the /data move; drop once they finish seeding
      - ${HDD}/data/downloads:/downloads
    # fails when gluetun restarts and leaves qbittorrent in a dead network namespace; autoheal then restarts it
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "10", "-o", "/dev/null", "https://1.1.1.1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # extracts rar'd releases so sonarr/radarr/lidarr can import them
  unpackerr:
    build: ./unpackerr
    container_name: unpackerr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
    volumes:
      # downloads only: extraction of untrusted archives can't touch the library
      - ${HDD}/data/downloads:/data/downloads
      # ponytail: legacy path for torrents added before the /data move; drop once they finish seeding
      - ${HDD}/data/downloads:/downloads
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  jellyseerr:
    build: ./jellyseerr
    container_name: jellyseerr
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/jellyseerr:/app/config
    networks:
      - proxy
      - media
    labels:
      - traefik.enable=true
      - traefik.http.routers.requests.rule=Host(`requests.${DOMAIN}`)
      - traefik.http.routers.requests.entrypoints=websecure
      - traefik.http.routers.requests.tls.certresolver=cloudflare
      - traefik.http.routers.requests.middlewares=secure-headers@file
      - traefik.http.services.requests.loadbalancer.server.port=5055
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  proxy:
    external: true
  media:
    external: true
