name: 'Deploy Services'
description: 'Deploys a stack by name from /DATA/stacks/stacks/'

inputs:
  stack:
    description: 'Stack name (directory under stacks/)'
    required: true
  force_recreate_services:
    description: 'Space-separated service names to force-recreate before the main up'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Deploy Stack
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        FORCE: ${{ inputs.force_recreate_services }}
      run: |
        cd /DATA/stacks/stacks
        # Stack-private secrets (ci/ci.env) feed interpolation without joining the shared .env.
        ENV_FILES=(--env-file .env)
        [ -f "$STACK/ci.env" ] && ENV_FILES+=(--env-file "$STACK/ci.env")

        # Check if compose.yml exists or is disabled
        if [ ! -f "$STACK/compose.yml" ]; then
          if [ -f "$STACK/compose.yml.disabled" ]; then
            echo "::warning::Stack $STACK is disabled - stopping any running containers"
            # Stop any running containers from this stack
            docker compose "${ENV_FILES[@]}" -f "$STACK/compose.yml".disabled down 2>/dev/null || true
            exit 0
          else
            echo "::error::No compose.yml found for stack $STACK"
            exit 1
          fi
        fi

        if [ -n "$FORCE" ]; then
          echo "Force-recreating: $FORCE"
          docker compose "${ENV_FILES[@]}" -f "$STACK/compose.yml" \
            up -d --build --pull always --force-recreate $FORCE
        fi

        echo "Deploying stack: $STACK"
        docker compose "${ENV_FILES[@]}" -f "$STACK/compose.yml" \
          up -d --build --pull always --remove-orphans

    - name: Check Stack Health
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        cd /DATA/stacks/stacks
        
        # Skip health check for disabled stacks
        if [ ! -f "$STACK/compose.yml" ]; then
          if [ -f "$STACK/compose.yml.disabled" ]; then
            echo "Skipping health check for disabled stack $STACK"
          fi
          exit 0
        fi
        
        sleep 15
        docker compose -f "$STACK/compose.yml" ps --format json 2>/dev/null | \
          jq -r 'select(.Health == "unhealthy") | .Name' 2>/dev/null | while read -r name; do
            if [ -n "$name" ]; then
              echo "::warning::Unhealthy: $name"
            fi
          done || true
